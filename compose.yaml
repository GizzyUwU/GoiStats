services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: goistats
      POSTGRES_PASSWORD: goistats
      POSTGRES_DB: goistats
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goistats -d goistats"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s
    restart: always

  goistats:
    build:
      context: .
    env_file: .env
    environment:
      - DATABASE_URL=postgres://goistats:goistats@postgres:5432/goistats
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3001/health | jq -e '.ok == true' >/dev/null",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s

  goistats_frontend:
    build:
      context: .
      dockerfile: Frontend.Dockerfile
    env_file: .env
    environment:
      - BACKEND_URL=http://goistats:3001
    depends_on:
      goistats:
        condition: service_healthy
    restart: always
    ports:
      - "27183:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/health | jq -e '.ok == true' >/dev/null",
        ]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 4s

volumes:
  pgdata: